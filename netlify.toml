[build]
  publish = "dist"
  command = "node scripts/build-netlify.mjs"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/anekafood"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/anekafood/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tukupack"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tukupack/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/order/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
